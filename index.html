<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c2410c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meals" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>" />
    <title>Meal Planner</title>
    <script>
      // If the app crashes while starting, do not leave a blank screen: show the error so the cause is visible.
      // (Runs BEFORE the module script and uses old syntax, so it works even if the bundle cannot be parsed at all.)
      (function () {
        function show(msg) {
          var root = document.getElementById('root');
          if (root && root.childElementCount) return; // once the UI has rendered it has its own error bar
          var box = document.getElementById('boot-error');
          if (!box) {
            box = document.createElement('pre');
            box.id = 'boot-error';
            box.style.cssText = 'margin:0;padding:24px 16px;white-space:pre-wrap;word-break:break-word;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#b91c1c;background:#fff;min-height:100vh;box-sizing:border-box';
            box.textContent = 'Meal Planner failed to start\n\n';
            document.body.appendChild(box);
          }
          box.textContent += msg + '\n\n' + navigator.userAgent + '\n\n';
        }
        window.addEventListener('error', function (e) {
          show((e.message || 'Hata') + (e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        window.__bootError = show;
        // Two small helpers missing in older Safari (libraries rely on them).
        if (!Array.prototype.at) {
          var at = function (n) { n = Math.trunc(n) || 0; if (n < 0) n += this.length; return n < 0 || n >= this.length ? undefined : this[n]; };
          Object.defineProperty(Array.prototype, 'at', { value: at, writable: true, configurable: true });
          Object.defineProperty(String.prototype, 'at', { value: at, writable: true, configurable: true });
        }
        if (!Object.hasOwn) {
          Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
